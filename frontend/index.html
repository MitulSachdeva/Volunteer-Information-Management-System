<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Information Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <h2>Volunteer Information Management System</h2>

    <div class="nav-links">
        <a href="login.html">Admin Login</a>
    </div>
</nav>

<div class="container">

    <h1>Become a Volunteer</h1>

    <form id="volunteerForm">

        <label>Full Name</label>
        <input name="name" placeholder="Enter Full Name" required>

        <label>Email Address</label>
        <input name="email" type="email" placeholder="Enter Email" required>

        <label>Phone Number</label>
        <input name="phone" placeholder="Enter Phone Number" required>

        <label>Age</label>
        <input name="age" type="number" placeholder="Enter Age" required>

        <label>Skills</label>
        <input name="skills" placeholder="Python, Teaching, Design">

        <label>Availability</label>
        <input name="availability" placeholder="Weekends / Full Time">

        <label>Address</label>
        <input name="address" placeholder="Enter Address">

        <button type="submit">Register Volunteer</button>

    </form>

</div>

<script src="js/register.js"></script>

</body>
</html>
